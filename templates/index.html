<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Amr Suhail Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --primary: #2563eb; --border: #e2e8f0; --accent: #10b981;
        }
        .dark-mode {
            --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8;
            --primary: #3b82f6; --border: #334155;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }

        /* Navigation */
        .navbar { position: sticky; top: 0; background: var(--bg-card); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; z-index: 100; }
        .theme-toggle { cursor: pointer; font-size: 1.5rem; padding: 5px; }

        /* Tools Section */
        .tools-section { background: var(--bg-card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 30px; }
        input, select { background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; }
        .btn-action { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; }

        /* Existing Styles kept and updated */
        .card { background: var(--bg-card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); text-align: center; color: var(--text-main); text-decoration: none; font-weight: 800; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        /* Progress Bar */
        .progress-bar-fill { background: var(--accent); }

        /* ... (بقية التنسيقات السابقة تم تحديث الألوان فيها لتناسب الوضع الليلي) ... */
    </style>
</head>
<body>

    <!-- التعديلات في قسم الأدوات -->
    <div class="main-content">
        <!-- أداة حاسبة المعدل -->
        <div class="tools-section">
            <h3 style="text-align:center;">🧮 حاسبة التقدير التراكمي</h3>
            <div id="subjectsList">
                <!-- هنا ستظهر المواد المضافة -->
            </div>
            <button class="btn-action" style="background:var(--accent); margin-bottom:10px;" onclick="addRow()">+ إضافة مادة</button>
            <button class="btn-action" onclick="calcFinalGPA()">احسب التقدير النهائي</button>
            <div id="gpaResult" style="margin-top:15px; font-weight:800; text-align:center;"></div>
        </div>
        
        <!-- المحتوى الأصلي (الدروس والملفات) يوضع هنا كما كان -->
    </div>

    <script>
        // نظام الوضع الليلي
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        // تحميل الوضع المحفوظ
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

        // منطق حساب التقدير
        function addRow() {
            const div = document.createElement('div');
            div.innerHTML = `<div style="display:flex; gap:5px; margin-bottom:5px;">
                <input type="number" placeholder="الساعات" class="s-hours">
                <input type="number" placeholder="الدرجة" class="s-grade">
            </div>`;
            document.getElementById('subjectsList').appendChild(div);
        }

        function calcFinalGPA() {
            let totalWeighted = 0;
            let totalHours = 0;
            document.querySelectorAll('#subjectsList > div').forEach(row => {
                const hours = parseFloat(row.querySelector('.s-hours').value);
                const grade = parseFloat(row.querySelector('.s-grade').value);
                if(hours && grade) {
                    totalWeighted += (hours * grade);
                    totalHours += hours;
                }
            });

            if(totalHours === 0) return;
            const avg = totalWeighted / totalHours;
            let letter = avg >= 90 ? 'A+' : avg >= 85 ? 'A' : avg >= 80 ? 'B+' : avg >= 75 ? 'B' : avg >= 70 ? 'C+' : 'D';
            document.getElementById('gpaResult').innerText = `المعدل: ${avg.toFixed(2)} | التقدير: ${letter}`;
        }
    </script>
</body>
</html>
