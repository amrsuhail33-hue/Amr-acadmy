<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محتوى مدفوع — {{ service_name }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --gold: #f59e0b; --green: #25D366; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 36px 28px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
        .badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 999px; margin-bottom: 18px; }
        .icon { font-size: 52px; color: var(--gold); margin-bottom: 14px; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { color: var(--muted); font-size: 15px; line-height: 1.8; margin-bottom: 24px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; margin-bottom: 10px; font-family: inherit; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-green:hover { background: #1eb856; }
        .btn-ghost { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,.2); }
        .btn-ghost:hover { background: rgba(255,255,255,.06); }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge"><i class="fa-solid fa-crown"></i> VIP</span>
        <div class="icon"><i class="fa-solid fa-lock"></i></div>
        <h1>{{ service_name }} — محتوى مدفوع</h1>
        <p>هذه الخدمة مدفوعة، للفتح تواصل معنا عبر واتساب وسنفعّلها لك.</p>
        <a class="btn btn-green" href="https://wa.me/967774485611?text={{ ('أريد تفعيل ' + service_name) | urlencode }}" target="_blank" rel="noopener">
            <i class="fa-brands fa-whatsapp"></i> تواصل عبر واتساب
        </a>
        <a class="btn btn-ghost" href="/"><i class="fa-solid fa-house"></i> العودة للرئيسية</a>
    </div>
</body>
</html>
