<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محتوى مدفوع — {{ service_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Outfit:wght@600;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <style>
        /* REDESIGN-V1-20261124 */
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --primary: #2563eb; --gold: #e79a2e; --green: #25D366; --font-arabic: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif; }
        html.dark-mode { --bg: #0b1120; --card: #162032; --text: #f8fafc; --muted: #94a3b8; --border: #1e293b; --primary: #3b82f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-arabic); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; transition: background 0.3s, color 0.3s; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 36px 28px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); }
        .lock-logo { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 26px rgba(37,99,235,0.3); border: 3px solid var(--card); background: #0f172a; }
        .lock-logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #e79a2e, #d97706); color: #fff; font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 999px; margin-bottom: 18px; }
        .icon { font-size: 52px; color: var(--gold); margin-bottom: 14px; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { color: var(--muted); font-size: 15px; line-height: 1.8; margin-bottom: 24px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; margin-bottom: 10px; font-family: inherit; min-height: 48px; transition: all 0.2s ease; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-green:hover { background: #1eb856; transform: translateY(-2px); }
        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--bg); }
    </style>
</head>
<body>
    <div class="card">
        <div class="lock-logo"><img src="https://i.postimg.cc/mDFqRtsJ/logo.png" alt="AMR ACADEMY Logo"></div>
        <span class="badge"><i class="fa-solid fa-crown"></i> VIP</span>
        <div class="icon"><i class="fa-solid fa-lock"></i></div>
        <h1>{{ service_name }} — محتوى مدفوع</h1>
        <p>هذه الخدمة مدفوعة، للفتح تواصل معنا عبر واتساب وسنفعّلها لك.</p>
        <a class="btn btn-green" href="https://wa.me/967774485611?text={{ ('أريد تفعيل ' + service_name) | urlencode }}" target="_blank" rel="noopener">
            <i class="fa-brands fa-whatsapp"></i> تواصل عبر واتساب
        </a>
        <a class="btn btn-ghost" href="/"><i class="fa-solid fa-house"></i> العودة للرئيسية</a>
    </div>
</body>
</html>
